name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint Python code
        run: python -m py_compile ingestion/s3_ingestion.py

      - name: Validate SQL files exist
        run: |
          test -f sql/redshift_schema.sql
          test -f sql/snowflake_load.sql
          test -f plsql/transform_procedures.sql
